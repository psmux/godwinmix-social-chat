name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Offline checks and unit tests
        shell: bash
        run: GMX_PYTHON=python ./check
      - name: Live Twitch read, 30 seconds (allowed to fail; it depends on who is streaming)
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        continue-on-error: true
        shell: bash
        run: SOCIAL_CHAT_LIVE=1 python -m unittest tests/test_live_twitch.py -v
